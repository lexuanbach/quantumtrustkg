# CustomResourceDefinition for MigrationPlan (Sect. 3, implementation).
#
# A plan describes a staged migration of the edges selected by targetSelector. The
# strategy is immediate, staged or canary, maxUnavailableEdges bounds the size of a
# rollout wave, and rollbackOnError freezes the plan when a promoted edge turns
# unhealthy. The controller reads the spec (controllers.MigrationReconciler) and
# writes the status subresource with the phase, the completed edges, the last batch
# size and the last error (KubernetesStatusWriter.WriteMigrationStatus). A plan
# affects only rollout feasibility, which is gate (v) of the QTPO filter, which means it can
# delay a promotion and cannot admit an inadmissible profile.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: migrationplans.quantumtrustkg.io
spec:
  group: quantumtrustkg.io
  scope: Namespaced
  names:
    plural: migrationplans
    singular: migrationplan
    kind: MigrationPlan
    shortNames:
      - mp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                strategy:
                  type: string
                  enum:
                    - immediate
                    - staged
                    - canary
                maxUnavailableEdges:
                  type: integer
                rollbackOnError:
                  type: boolean
              required:
                - strategy
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                phase:
                  type: string
                lastTransitionTime:
                  type: string
                completedEdges:
                  type: integer
                lastBatchSize:
                  type: integer
                lastError:
                  type: string
      subresources:
        status: {}
