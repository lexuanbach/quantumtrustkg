# CustomResourceDefinition for CryptoCapabilityProfile (Sect. 3, implementation).
#
# A capability record states which cryptographic profiles a workload can speak. It
# is the capability evidence of the paper. The fields source and freshnessSeconds
# (300 s when absent) and status.observedAt are its provenance, and gate (iv) of the
# QTPO filter rejects a record that is stale at decision time. The operator or a
# publisher writes the record and the controller reads it
# (controllers.CapabilityReconciler, parsed by parseCapability). The record is a
# declared claim. Limitation: it is not yet bound to a workload identity, which is
# the SPIFFE/SPIRE gap named in Sect. 3.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cryptocapabilityprofiles.quantumtrustkg.io
spec:
  group: quantumtrustkg.io
  scope: Namespaced
  names:
    plural: cryptocapabilityprofiles
    singular: cryptocapabilityprofile
    kind: CryptoCapabilityProfile
    shortNames:
      - ccp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                workloadSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                algorithms:
                  type: array
                  items:
                    type: string
                profiles:
                  type: array
                  items:
                    type: string
                source:
                  type: string
                freshnessSeconds:
                  type: integer
              required:
                - algorithms
            status:
              type: object
              properties:
                observedAt:
                  type: string
                phase:
                  type: string
      subresources:
        status: {}
